<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worm</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#0a1f18">
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="skins.js"></script><!-- catálogo de apariencias + desbloqueo/persistencia -->
  <script src="render.js"></script><!-- defines canvas, ctx, draw() -->
  <script src="audio.js"></script><!-- sonidos generados + vibraciones, sin dependencias externas -->
  <script src="input.js"></script><!-- attaches keyboard + touch listeners -->
  <script src="game.js"></script> <!-- state, loop, boot -->

  <script>
    // Registra el service worker para que el juego quede cacheado
    // y funcione sin conexión después de la primera carga.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').catch(function(err) {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
